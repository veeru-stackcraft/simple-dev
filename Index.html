  <script>
    function handleClick(evnt) {
      alert("Event handled, but default action prevented");
      evnt.preventDefault(); // Prevents the default action
      evnt.stopPropagation()
    }

    const arr = [50, 400, 10, 20, 30, 50, 40, 50, 100, 60, 300, 70, 80, 90, 200];
    let val = arr.sort((a, b) => a - b)
    document.getElementById("header3").innerText = val

    for (let i = 0; i < val.length; i++) {
      val[i] <= val[i + 1] ? console.log("true") : console.log("false")
    }

  </script>
